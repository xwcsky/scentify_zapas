<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <h1>🛠️ Panel Administratora</h1>
    <button (click)="logout()" class="btn btn-outline-danger">Wyloguj</button>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm clickable-card" routerLink="/admin/kody-rabatowe" style="cursor: pointer; transition: transform 0.2s;">
        <div class="card-body text-center p-5">
          <div class="display-1 mb-3">🎟️</div>
          <h3 class="card-title">Kody Rabatowe</h3>
          <p class="card-text text-muted">Dodawaj, usuwaj i sprawdzaj użycie kodów zniżkowych.</p>
          <button class="btn btn-primary mt-3">Zarządzaj &raquo;</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm clickable-card" routerLink="/admin/devices" style="cursor: pointer; transition: transform 0.2s;">
        <div class="card-body text-center p-5">
          <div class="display-1 mb-3">🤖</div>
          <h3 class="card-title">Urządzenia</h3>
          <p class="card-text text-muted">Status maszyn, poziom płynów.</p>
          <button class="btn btn-primary mt-3">Zarządzaj &raquo;</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm clickable-card" routerLink="/admin/statistics" style="cursor: pointer; transition: transform 0.2s;">
        <div class="card-body text-center p-5">
          <div class="display-1 mb-3">📊</div>
          <h3 class="card-title">Statystyki</h3>
          <p class="card-text text-muted">Historia sprzedaży i wykresy.</p>
          <button class="btn btn-primary mt-3">Przeglądaj &raquo;</button>
        </div>
      </div>
    </div>
  </div>
</div>
